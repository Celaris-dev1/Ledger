[project]
name = "ledger-sdk"
version = "0.2.0"
description = "Stdlib-only client for the Ledger tamper-evident agent decision log, with optional framework adapters"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.30"]
autogen = ["pyautogen>=0.2"]
openhands = ["openhands-ai>=0.9"]
all = ["langchain-core>=0.2", "crewai>=0.30", "pyautogen>=0.2", "openhands-ai>=0.9"]

[tool.setuptools]
packages = ["ledger_sdk", "ledger_sdk.adapters"]
