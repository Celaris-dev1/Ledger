services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]
  ledgerd:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      LEDGER_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ledger?sslmode=disable
      LEDGER_TOKEN: ${LEDGER_TOKEN:-}
      LEDGER_SIGNING_KEY: ${LEDGER_SIGNING_KEY:-}
    ports: ["8410:8410"]
    volumes: [ledgerdata:/data]
volumes:
  pgdata: {}
  ledgerdata: {}
